<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Rewritten at build time by `flutter build web --base-href /app-thu-chi/`.
       Every other path here stays relative so the app works from a subpath. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Ứng dụng quản lý thu chi cá nhân, chạy ngay trong trình duyệt.">
  <meta name="theme-color" content="#3F6DF0">

  <!-- Runs full screen from the iOS Home Screen instead of inside Safari's
       chrome. Home-screen web apps are also exempt from Safari's 7-day
       storage wipe, which is what keeps the user's ledger alive. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Thu Chi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>Thu Chi</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
