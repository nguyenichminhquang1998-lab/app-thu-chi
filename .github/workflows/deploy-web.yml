name: Deploy web to GitHub Pages

# Publishes the browser version of the app to
# https://nguyenichminhquang1998-lab.github.io/app-thu-chi/
# Requires a one-time setup in the repo: Settings -> Pages -> Source:
# "GitHub Actions" (not "Deploy from a branch").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned so a stable-channel bump can never silently break the
          # public deploy. The iOS workflow stays unpinned on purpose.
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get

      - name: Kiểm tra binary SQLite cho web đã được commit chưa
        run: |
          for f in web/sqflite_sw.js web/sqlite3.wasm; do
            if [ ! -f "$f" ]; then
              echo "::error::Thiếu $f. Chạy 'dart run sqflite_common_ffi_web:setup' rồi commit lại."
              exit 1
            fi
          done

      - run: flutter analyze

      # Every sqflite-backed test file opens the same fixed on-disk database
      # path (see test/test_support.dart). flutter test runs test files
      # concurrently by default, and on a multi-core runner that races two
      # files against the same file, producing sqlite "readonly database"
      # errors. --concurrency=1 serializes test files so that race can't
      # happen — this only affects CI; local `flutter test` is unaffected.
      - run: flutter test --concurrency=1

      - name: Build web
        run: flutter build web --release --base-href /app-thu-chi/

      - name: Serve the app for unknown paths too, instead of a 404
        run: cp build/web/index.html build/web/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
